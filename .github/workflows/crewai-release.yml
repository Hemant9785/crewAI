name: crewai binaries

# Builds the standalone crewai executable on each OS (a binary has to be built on the OS it runs on).
# Push a tag like crewai-v0.1.0 to publish them on a GitHub release, or run it by hand to get artifacts only.
on:
  push:
    tags: ['crewai-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # linux x64, linux arm64, macOS Intel, macOS Apple silicon, Windows x64
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: app
        shell: bash
    env:
      # Public Firebase web config (identifiers, not secrets). Set as repository variables.
      CREWAI_FIREBASE_PROJECT_ID: ${{ vars.CREWAI_FIREBASE_PROJECT_ID }}
      CREWAI_FIREBASE_API_KEY: ${{ vars.CREWAI_FIREBASE_API_KEY }}
      CREWAI_FIREBASE_AUTH_DOMAIN: ${{ vars.CREWAI_FIREBASE_AUTH_DOMAIN }}
      CREWAI_FIREBASE_APP_ID: ${{ vars.CREWAI_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: node scripts/build-binary.mjs
      - name: Smoke test the binary
        run: |
          for f in release/crewai-*; do
            case "$f" in *.sha256) continue;; esac
            "$f" --version
            "$f" --help | head -3
          done
      - uses: actions/upload-artifact@v4
        with:
          name: crewai-${{ matrix.os }}
          path: app/release/*

  publish:
    if: startsWith(github.ref, 'refs/tags/crewai-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Combine checksums
        run: cd release && cat *.sha256 > SHA256SUMS && rm *.sha256 && ls -l
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
